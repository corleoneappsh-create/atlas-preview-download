name: Package APK
on:
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Download signed preview APK
        run: curl -fL 'https://github.com/corleoneappsh-create/atlas-preview-download/releases/download/v1.1.0-preview/Atlas-Preview-1.1.0.apk' -o Atlas-Preview-1.1.0.apk
      - name: Verify SHA-256
        run: echo '5b84c5682e0a05c2bd1db1513c35deba07f7ea801ff985122e3d00004b12725e  Atlas-Preview-1.1.0.apk' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: Atlas-Preview-1.1.0
          path: Atlas-Preview-1.1.0.apk
          compression-level: 0
          retention-days: 1
