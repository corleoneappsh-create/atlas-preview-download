name: Export Iron Tide renders
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: iron-tide-g21-renders
          path: renders/iron-tide/G21/*.jpg
          retention-days: 1
